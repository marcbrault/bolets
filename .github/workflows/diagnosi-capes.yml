name: Diagnosi capes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnosi:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/diagnosi-capes.sh
      - name: Desa la diagnosi a la branca diagnosi-capes
        run: |
          git config user.name "bolets-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b diagnosi-capes
          git add -f diag
          git commit -m "Diagnosi capes"
          git push -f origin diagnosi-capes
