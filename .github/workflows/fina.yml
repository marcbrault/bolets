name: Construeix capes fines

on:
  workflow_dispatch:
    inputs:
      factor:
        description: "Caselles per cel·la de 5 km (10 = 500 m, 50 = 100 m en trossos)"
        default: "10"

permissions:
  contents: write

concurrency:
  group: capes
  cancel-in-progress: false

jobs:
  fina:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pillow pyproj geopandas rasterio requests shapely
      - name: Construeix les capes fines
        run: python scripts/build-fina.py
        env:
          FACTOR: ${{ inputs.factor }}
      - name: Desa les dades
        run: |
          git config user.name "bolets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fina.json data/fina.bin.gz data/fina100 2>/dev/null || git add data/fina.json data/fina.bin.gz
          git diff --cached --quiet && exit 0
          git commit -m "Capes fines (factor ${{ inputs.factor }}) $(date -u +%F)"
          git pull --rebase origin main
          git push
