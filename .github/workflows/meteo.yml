name: Actualitza meteo

on:
  schedule:
    - cron: '17 4 * * *'   # cada dia a les 04:17 UTC
  workflow_dispatch:        # també es pot llançar a mà des de la pestanya Actions

permissions:
  contents: write

jobs:
  meteo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-meteo.mjs
      - name: Desa les dades
        run: |
          git config user.name "bolets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/meteo-*.json
          git diff --cached --quiet || git commit -m "Meteo $(date -u +%F)"
          git push
