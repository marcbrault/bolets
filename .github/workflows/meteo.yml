name: Actualitza meteo

on:
  schedule:
    - cron: '17 4 * * *'   # cada dia a les 04:17 UTC
  workflow_dispatch:        # també es pot llançar a mà des de la pestanya Actions

permissions:
  contents: write

concurrency:
  group: meteo
  cancel-in-progress: false

jobs:
  meteo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/update-meteo.mjs
      - name: Desa les dades
        run: |
          git config user.name "bolets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/meteo-*.json
          git diff --cached --quiet && exit 0
          git commit -m "Meteo $(date -u +%F)"
          git pull --rebase origin main
          git push
